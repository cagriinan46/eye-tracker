[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["src"]

# Initial Phase 1 Vision adapters only; this does not decide packaging.
# MediaPipe depends on the contrib OpenCV wheel, which shares cv2 with opencv-python.
[dependency-groups]
vision = ["mediapipe==0.10.35", "opencv-contrib-python==5.0.0.93"]
